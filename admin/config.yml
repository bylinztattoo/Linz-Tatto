backend:
  name: git-gateway
  branch: main

media_folder: "img/uploads"
public_folder: "/img/uploads"

site_url: "/"
display_url: "/"
logo_url: "/img/logo-eye.svg"

collections:
  - name: "portfolio_galleries"
    label: "Portfolio Galleries"
    description: "Edit each tattoo style gallery separately. Each gallery has one cover image and multiple internal gallery images."
    files:
      - label: "Black & Grey"
        name: "black_grey"
        file: "data/galleries/black-grey.json"
        fields:
          - { label: "Gallery Title", name: "title", widget: "string", default: "Black & Grey", hint: "This title appears on the gallery card." }
          - { label: "Category", name: "category", widget: "hidden", default: "Black & Grey" }
          - { label: "Cover Image", name: "coverImage", widget: "image", required: false, hint: "Main image shown on the website before opening the internal gallery." }
          - { label: "Gallery Description", name: "description", widget: "text", required: false, hint: "Short description shown on the gallery card or modal." }
          - label: "Internal Gallery Images"
            name: "images"
            widget: "list"
            collapsed: true
            summary: "{{fields.title}}"
            hint: "Upload all images that belong to this tattoo style."
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Image Title", name: "title", widget: "string", required: false }
              - { label: "Image Description", name: "description", widget: "text", required: false }

      - label: "Fine Line"
        name: "fine_line"
        file: "data/galleries/fine-line.json"
        fields:
          - { label: "Gallery Title", name: "title", widget: "string", default: "Fine Line", hint: "This title appears on the gallery card." }
          - { label: "Category", name: "category", widget: "hidden", default: "Fine Line" }
          - { label: "Cover Image", name: "coverImage", widget: "image", required: false, hint: "Main image shown on the website before opening the internal gallery." }
          - { label: "Gallery Description", name: "description", widget: "text", required: false, hint: "Short description shown on the gallery card or modal." }
          - label: "Internal Gallery Images"
            name: "images"
            widget: "list"
            collapsed: true
            summary: "{{fields.title}}"
            hint: "Upload all images that belong to this tattoo style."
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Image Title", name: "title", widget: "string", required: false }
              - { label: "Image Description", name: "description", widget: "text", required: false }

      - label: "Micro Realism"
        name: "micro_realism"
        file: "data/galleries/micro-realism.json"
        fields:
          - { label: "Gallery Title", name: "title", widget: "string", default: "Micro Realism", hint: "This title appears on the gallery card." }
          - { label: "Category", name: "category", widget: "hidden", default: "Micro Realism" }
          - { label: "Cover Image", name: "coverImage", widget: "image", required: false, hint: "Main image shown on the website before opening the internal gallery." }
          - { label: "Gallery Description", name: "description", widget: "text", required: false, hint: "Short description shown on the gallery card or modal." }
          - label: "Internal Gallery Images"
            name: "images"
            widget: "list"
            collapsed: true
            summary: "{{fields.title}}"
            hint: "Upload all images that belong to this tattoo style."
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Image Title", name: "title", widget: "string", required: false }
              - { label: "Image Description", name: "description", widget: "text", required: false }

      - label: "BlackWork"
        name: "blackwork"
        file: "data/galleries/blackwork.json"
        fields:
          - { label: "Gallery Title", name: "title", widget: "string", default: "BlackWork", hint: "This title appears on the gallery card." }
          - { label: "Category", name: "category", widget: "hidden", default: "BlackWork" }
          - { label: "Cover Image", name: "coverImage", widget: "image", required: false, hint: "Main image shown on the website before opening the internal gallery." }
          - { label: "Gallery Description", name: "description", widget: "text", required: false, hint: "Short description shown on the gallery card or modal." }
          - label: "Internal Gallery Images"
            name: "images"
            widget: "list"
            collapsed: true
            summary: "{{fields.title}}"
            hint: "Upload all images that belong to this tattoo style."
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Image Title", name: "title", widget: "string", required: false }
              - { label: "Image Description", name: "description", widget: "text", required: false }

      - label: "Color"
        name: "color"
        file: "data/galleries/color.json"
        fields:
          - { label: "Gallery Title", name: "title", widget: "string", default: "Color", hint: "This title appears on the gallery card." }
          - { label: "Category", name: "category", widget: "hidden", default: "Color" }
          - { label: "Cover Image", name: "coverImage", widget: "image", required: false, hint: "Main image shown on the website before opening the internal gallery." }
          - { label: "Gallery Description", name: "description", widget: "text", required: false, hint: "Short description shown on the gallery card or modal." }
          - label: "Internal Gallery Images"
            name: "images"
            widget: "list"
            collapsed: true
            summary: "{{fields.title}}"
            hint: "Upload all images that belong to this tattoo style."
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Image Title", name: "title", widget: "string", required: false }
              - { label: "Image Description", name: "description", widget: "text", required: false }

      - label: "Other"
        name: "other"
        file: "data/galleries/other.json"
        fields:
          - { label: "Gallery Title", name: "title", widget: "string", default: "Other", hint: "This title appears on the gallery card." }
          - { label: "Category", name: "category", widget: "hidden", default: "Other" }
          - { label: "Cover Image", name: "coverImage", widget: "image", required: false, hint: "Main image shown on the website before opening the internal gallery." }
          - { label: "Gallery Description", name: "description", widget: "text", required: false, hint: "Short description shown on the gallery card or modal." }
          - label: "Internal Gallery Images"
            name: "images"
            widget: "list"
            collapsed: true
            summary: "{{fields.title}}"
            hint: "Upload all images that belong to this tattoo style."
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Image Title", name: "title", widget: "string", required: false }
              - { label: "Image Description", name: "description", widget: "text", required: false }

  - name: "reviews"
    label: "Client Reviews"
    description: "Approve or edit client reviews before they appear on the website."
    files:
      - label: "Approved Reviews"
        name: "reviews"
        file: "data/reviews.json"
        fields:
          - label: "Reviews"
            name: "reviews"
            widget: "list"
            collapsed: true
            summary: "{{fields.name}} — {{fields.rating}} Stars"
            fields:
              - { label: "Approved / Publish on Website", name: "approved", widget: "boolean", default: false, hint: "Turn this on only when the review is approved." }
              - { label: "Client Name", name: "name", widget: "string" }
              - label: "Rating"
                name: "rating"
                widget: "select"
                options:
                  - { label: "5 Stars", value: 5 }
                  - { label: "4 Stars", value: 4 }
                  - { label: "3 Stars", value: 3 }
              - { label: "Tattoo Style", name: "style", widget: "string", required: false }
              - { label: "Review", name: "review", widget: "text" }

  - name: "site_settings"
    label: "Site Settings"
    description: "Basic editable text and links for the website."
    files:
      - label: "General Site Info"
        name: "site"
        file: "data/site.json"
        fields:
          - { label: "Hero Tagline", name: "heroTagline", widget: "string", required: false, default: "Custom tattoo art designed with precision, flow, and intention." }
          - { label: "Instagram Link", name: "instagram", widget: "string", required: false }
          - { label: "Facebook Link", name: "facebook", widget: "string", required: false }
          - { label: "TikTok Link", name: "tiktok", widget: "string", required: false }
