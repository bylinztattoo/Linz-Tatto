backend:
  name: git-gateway
  branch: main

media_folder: "img/uploads"
public_folder: "/img/uploads"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "Linz Tattoo Settings"
        name: "site"
        file: "data/site.json"
        fields:
          - { label: "Business Name", name: "businessName", widget: "string" }
          - { label: "Location", name: "location", widget: "string" }
          - { label: "Instagram", name: "instagram", widget: "string" }
          - { label: "Booking Email", name: "bookingEmail", widget: "string" }
          - { label: "Deposit Text", name: "depositText", widget: "text" }
          - label: "Styles"
            name: "styles"
            widget: "list"
            summary: "{{fields.style}}"
            field:
              label: "Style"
              name: "style"
              widget: "string"

  - name: "portfolio"
    label: "Portfolio Gallery"
    files:
      - label: "Tattoo Gallery"
        name: "gallery"
        file: "data/gallery.json"
        fields:
          - label: "Gallery Items"
            name: "gallery"
            widget: "list"
            summary: "{{fields.category}} — {{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Tattoo Style / Category"
                name: "category"
                widget: "select"
                options:
                  - "Black & Grey Piece"
                  - "Fine Line Detail"
                  - "Micro Realism"
                  - "Realism"
                  - "Color"
                  - "Color"
                  - "Other"
                  - "Other"
                  - "Process"
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Featured", name: "featured", widget: "boolean", required: false, default: false }


  - name: "reviews"
    label: "Client Reviews"
    files:
      - label: "Approved Reviews"
        name: "reviews"
        file: "data/reviews.json"
        fields:
          - label: "Reviews"
            name: "reviews"
            widget: "list"
            summary: "{{fields.name}} — {{fields.rating}} Stars"
            fields:
              - { label: "Approved / Publish on Website", name: "approved", widget: "boolean", default: false }
              - { label: "Client Name", name: "name", widget: "string" }
              - label: "Rating"
                name: "rating"
                widget: "select"
                options:
                  - { label: "5 Stars", value: 5 }
                  - { label: "4 Stars", value: 4 }
                  - { label: "3 Stars", value: 3 }
              - { label: "Tattoo Style", name: "style", widget: "string", required: false }
              - { label: "Review", name: "review", widget: "text" }
