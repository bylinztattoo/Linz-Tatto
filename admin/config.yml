backend:
  name: git-gateway
  branch: main

media_folder: "img/uploads"
public_folder: "/img/uploads"

collections:
  - name: "portfolio"
    label: "Portfolio Galleries"
    files:
      - label: "Tattoo Style Galleries"
        name: "portfolio"
        file: "data/portfolio.json"
        fields:
          - label: "Galleries"
            name: "galleries"
            widget: "list"
            summary: "{{fields.category}}"
            fields:
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - "Black & Grey Piece"
                  - "Fine Line Detail"
                  - "Micro Realism"
                  - "Realism"
                  - "Color"
                  - "Other"
              - { label: "Gallery Title", name: "title", widget: "string" }
              - { label: "Gallery Description", name: "description", widget: "text", required: false }
              - { label: "Cover Image", name: "coverImage", widget: "image", required: false }
              - label: "Internal Gallery Images"
                name: "images"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Image", name: "image", widget: "image" }
                  - { label: "Image Title", name: "title", widget: "string", required: false }
                  - { label: "Image Description", name: "description", widget: "text", required: false }

  - name: "reviews"
    label: "Client Reviews"
    files:
      - label: "Approved Reviews"
        name: "reviews"
        file: "data/reviews.json"
        fields:
          - label: "Reviews"
            name: "reviews"
            widget: "list"
            summary: "{{fields.name}} — {{fields.rating}} Stars"
            fields:
              - { label: "Approved / Publish on Website", name: "approved", widget: "boolean", default: false }
              - { label: "Client Name", name: "name", widget: "string" }
              - label: "Rating"
                name: "rating"
                widget: "select"
                options:
                  - { label: "5 Stars", value: 5 }
                  - { label: "4 Stars", value: 4 }
                  - { label: "3 Stars", value: 3 }
              - { label: "Tattoo Style", name: "style", widget: "string", required: false }
              - { label: "Review", name: "review", widget: "text" }
